site_name: django-countdown
site_description: >-
  Announce planned Django downtime with a live countdown banner, then serve an
  HTTP 503 maintenance page when the window opens — while superusers keep
  working.
site_url: https://iplweb.github.io/django-countdown/
site_author: Michał Pasternak

repo_url: https://github.com/iplweb/django-countdown
repo_name: iplweb/django-countdown
edit_uri: edit/main/docs/

copyright: Released under the MIT licence.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iplweb/django-countdown
      name: django-countdown on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/django-countdown/
      name: django-countdown on PyPI

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - How it works: guide/how-it-works.md
      - Countdown banner: guide/banner.md
      - Blocked page: guide/blocked-page.md
      - Management command: guide/management-command.md
      - Django admin: guide/admin.md
      - Multi-site setup: guide/multisite.md
      - Translations: guide/i18n.md
  - Reference:
      - Settings: reference/settings.md
      - SiteCountdown model: reference/model.md
      - Template context: reference/context.md
      - Template blocks: reference/template-blocks.md
  - Contributing: contributing.md
  - Changelog: changelog.md
